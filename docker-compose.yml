services:
  db:
    image: postgres:16-alpine
    container_name: sarh_orders_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - '5433:5432'
    volumes:
      - sarh_orders_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d orders']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sarh_orders_pgdata:
